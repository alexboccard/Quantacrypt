[project]
name = "quantacrypt"
version = "1.4.0"
description = "Post-quantum file encryption using ML-KEM (Kyber-768) + AES-256-GCM with optional Shamir secret sharing"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
keywords = ["encryption", "post-quantum", "kyber", "shamir", "aes-gcm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    # Floor tracks the newest advisory, not the oldest version that resolves:
    #   - GHSA-537c-gmf6-5ccf (vulnerable OpenSSL statically linked into the
    #     wheels, fixed in 48.0.1)
    #   - GHSA-g6cj-pr64-35w5 (Bleichenbacher oracle in PKCS#7 EnvelopedData
    #     decryption, fixed in 50.0.0)
    #   - GHSA-p423-j2cm-9vmq (buffer overflow on non-contiguous buffers,
    #     fixed in 46.0.7)
    #   - GHSA-m959-cc7f-wv43, GHSA-m2h6-j472-rp4c, GHSA-jwv3-5hgf-82ww
    #     (DNS name constraints and X.509 path building, fixed in 46.0.6
    #     and 49.0.0)
    # Only the OpenSSL one is reachable here — this code touches AESGCM,
    # HKDF and hashes, never X.509 or PKCS#7, and every buffer it hands to
    # AESGCM is a contiguous bytes/bytearray — but 50.0 covers all of them.
    #
    # Intel macOS is the exception: cryptography stopped publishing x86_64 /
    # universal2 macOS wheels after 48.0.1 and argon2-cffi-bindings after
    # 25.1.0, so a Rosetta build of the Intel DMG would compile both from
    # source with an unpinned Rust/CMake toolchain. That platform pins the
    # last wheel-backed releases instead — 48.0.1 still carries the one
    # reachable fix; the X.509/PKCS#7 ones it lacks are unreachable here.
    "cryptography>=50.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "cryptography>=48.0.1,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "argon2-cffi>=23.1",
    "argon2-cffi-bindings>=21.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "argon2-cffi-bindings>=21.2,<26; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Pinned to the major the code binds to, not the oldest that resolves.
    # kyber_encaps unpacks `Kyber768.encaps(pk)` as (shared_secret, ct); a
    # resolver landing on an older major with the opposite order would write
    # the shared secret into public metadata as kyber_kem_ct and produce a
    # file that looks entirely normal. CI is immune (--require-hashes), but
    # `pip install -e ".[dev]"` resolves fresh.
    "kyber-py>=1.0,<2",
    "shamirs>=4.0,<5",
    "mnemonic>=0.21",
]

[project.optional-dependencies]
# tkinterdnd2-universal 1.7.x imports tkinter.tix, which Python 3.13 removed:
# the module failed to import on the shipped interpreter and every Tk DMG
# since has silently lost drag-and-drop (build.py only warns). The maintained
# package keeps the import name and ships osx-arm64 / osx-x64 tkdnd binaries.
dnd = ["tkinterdnd2>=0.6"]
strength = ["zxcvbn>=4.4"]
volumes = ["fusepy>=3.0"]
# Pillow < 12.3 has a long tail of open advisories — decompression bombs and
# codec overflows, from the FITS GZIP one (GHSA-gg2v-6j66-8q5j) through the
# JPEG2000 tiled-decode scratch-buffer growth (GHSA-vjc4-5qp5-m44j); 12.1.1
# alone still matched 18. None are reachable from the build, which only
# encodes icns slices from a PNG in this repo, but the floor still has to
# cover the patched release.
build = ["pyinstaller>=6.10", "Pillow>=12.3"]
dev = [
    # pytest's tmpdir handling was flagged twice — GHSA-7g38-3x9v-v7vp, then
    # again as GHSA-6w46-j5rx-g56g (fixed in 9.0.3).  Pygments < 2.20 has
    # GHSA-5239-wwwm-4pmq (ReDoS on the GUID regex), superseding the earlier
    # GHSA-mrwq-x4v8-fh7p.  Pygments is pulled transitively by pytest's
    # error-formatting, but pin it explicitly so Dependabot can see the
    # floor directly.
    "pytest>=9.0.3",
    "pip-audit>=2.7",
    "pytest-cov>=4.0",
    # -n auto is the only lever left once the KDF cost is out of the way:
    # the suite is ~2,200 mostly-independent tests, each in its own tmp_path.
    # Passed on the command line, never in addopts, so a single-test run
    # stays serial and debuggable.
    "pytest-xdist>=3.6",
    # Thread method, not SIGALRM: this suite installs and tests its own
    # SIGTERM/SIGINT handlers, and the signal-based timeout would fight them.
    "pytest-timeout>=2.3",
    # Shuffles test order to surface order-dependence and shared-global-state
    # leaks — the root cause of "passes alone, fails in the suite". Reproduce
    # a bad order from the seed it prints: -p randomly --randomly-seed=<n>.
    "pytest-randomly>=3.15",
    "pygments>=2.20",
    # The lockfile check in CI resolves with the same uv as `uv lock` does
    # locally, and comes from the hash-pinned lock like every other tool
    # rather than whatever `pip install uv` serves that day.
    "uv>=0.5",
    # volumes (fusepy) must be in dev so CI's `pip install .[dev]` has it:
    # the release build imports it into the bundle, and the test suite
    # asserts the fuse.Operations subclass contract.
    "quantacrypt[dnd,strength,build,volumes]",
]

[project.urls]
Homepage = "https://github.com/alexboccard/QuantaCrypt"
Repository = "https://github.com/alexboccard/QuantaCrypt"
Issues = "https://github.com/alexboccard/QuantaCrypt/issues"

[project.scripts]
quantacrypt = "quantacrypt:main"
qc-core = "quantacrypt.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "real_argon2: run with the shipped Argon2id parameters instead of the cheap test ones",
    "gui: drives real Tk widgets — must run serially (the window server is shared state)",
    "needs_real_window: needs a focusable window, so test-window hiding is suspended for it",
]
# --cov=quantacrypt (the package), not quantacrypt.core: pytest-cov's --cov
# overrides [tool.coverage.run] source, so the narrower value silently made
# the documented `python -m pytest` and the release gate core-only.
addopts = "--cov=quantacrypt --cov-report=term-missing --cov-report=html:htmlcov"

[tool.coverage.run]
# The whole package, not core/ alone: scoping the measurement to core/ meant
# the aggregate could read 95% while ui/volume_manager.py sat at 11% and
# __main__.py at 0%, because unmeasured files simply do not appear in the
# report.  scripts/check_coverage.py enforces the floor per file.
source = ["src/quantacrypt"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]
show_missing = true
skip_empty = true
fail_under = 95

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantacrypt = ["assets/*.png"]
