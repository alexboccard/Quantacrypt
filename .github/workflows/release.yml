name: Build & Release

on:
  push:
    tags:
      - "v*"          # triggers on v1.0.0, v1.2.3-beta, etc.

  workflow_dispatch:   # allow manual runs for testing (no release created)

# Least privilege: only `release` (gh release create, the attestation) and
# `bump-version` (git push) need write, and they say so per job.  The build
# jobs execute a lot of code fetched at build time — PyInstaller, a
# python.org installer, XcodeGen — and a compromise in any of it should fail
# the build, not rewrite the repository or publish a release.  Everything
# that runs here is pinned: actions by commit SHA (Dependabot keeps the pins
# current), Python packages by hash from requirements-lock.txt, the
# python.org installer and XcodeGen by SHA-256.
permissions:
  contents: read

env:
  # One interpreter for all three artefacts.  The Tk arm64 and native jobs
  # take it from actions/setup-python, the x86_64 job from the python.org
  # universal2 installer, and the two have to name the same release or the
  # DMGs under one tag ship different standard libraries.
  PYTHON_VERSION: "3.13.15"
  PYTHON_PKG_URL: "https://www.python.org/ftp/python/3.13.15/python-3.13.15-macos11.pkg"
  # SHA-256 of that installer, recorded 2026-09-04; update all three together.
  PYTHON_PKG_SHA256: "3b7eaf7f29825f796e8267024435540ddf1f17fc9a97ad58095daa7a75bfdcd3"
  PYTHON_BIN: "/usr/local/bin/python3.13"

jobs:
  test:
    name: Run tests
    runs-on: macos-14
    # Every build job is capped at 60; the GUI suite on macOS was the one
    # job left on the 6-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The lock pins what is installed; pip's build isolation would still
      # fetch an unpinned setuptools to build fusepy's sdist and this
      # project.  Install the backend from the lock first, then build with
      # no isolation so nothing outside the lock ever runs.
      - name: Install dependencies (hash-pinned, no build isolation)
        run: |
          python scripts/lock_subset.py setuptools > "$RUNNER_TEMP/build-requirements.txt"
          pip install --require-hashes -r "$RUNNER_TEMP/build-requirements.txt"
          pip install --no-build-isolation --require-hashes -r requirements-lock.txt
          pip install --no-deps --no-build-isolation .

      # -p no:randomly: pytest-randomly is in the lock because the periodic
      # shuffled run is the only thing that catches order-dependence, but a
      # release gate has to be reproducible, not exploratory.
      - name: Run tests
        run: python -m pytest --tb=short -q -p no:randomly --cov-report=json:coverage.json

      # The aggregate fail_under can read 95% while a single file sits far
      # below it; ci.yml already gates per file and the release must not be
      # the weaker of the two.
      - name: Enforce per-file coverage floor
        run: python scripts/check_coverage.py --min 95 --json coverage.json

  build-arm64:
    name: Build (arm64)
    needs: test
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # sed exits 0 when nothing matches, so a reformatted version line used
      # to ship a release labelled with the previous version — and the
      # in-app update checker then shows every user a banner that installing
      # cannot clear.  stamp_version.py fails on a missed target.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/stamp_version.py "${GITHUB_REF#refs/tags/v}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (hash-pinned, no build isolation)
        run: |
          python scripts/lock_subset.py setuptools > "$RUNNER_TEMP/build-requirements.txt"
          pip install --require-hashes -r "$RUNNER_TEMP/build-requirements.txt"
          pip install --no-build-isolation --require-hashes -r requirements-lock.txt
          pip install --no-deps --no-build-isolation .

      - name: Build .app and .dmg
        run: python scripts/build.py --arch arm64 --skip-tests

      # Architecture *and* signature: an unsigned or half-signed .app opens
      # as "damaged and can't be opened" rather than showing the expected
      # unidentified-developer prompt, which is the exact failure the ad-hoc
      # signing exists to prevent.  build.py already fails on a signing
      # error; this is the independent check on the artefact we publish.
      - name: Verify the built app is arm64 and signed
        run: |
          file dist/tk/quantacrypt.app/Contents/MacOS/quantacrypt
          file dist/tk/quantacrypt.app/Contents/MacOS/quantacrypt | grep -q "arm64" || { echo "ERROR: binary is not arm64!"; exit 1; }
          codesign --verify --deep --strict dist/tk/quantacrypt.app
          echo "✓ Binary verified as arm64 and signed"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quantacrypt-arm64
          path: dist/quantacrypt-arm64.dmg
          if-no-files-found: error

  build-x86_64:
    name: Build (x86_64 via Rosetta)
    needs: test
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/stamp_version.py "${GITHUB_REF#refs/tags/v}"

      - name: Install Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Install universal2 Python from python.org
        run: |
          curl -L "$PYTHON_PKG_URL" -o /tmp/python.pkg
          echo "$PYTHON_PKG_SHA256  /tmp/python.pkg" | shasum -a 256 -c -
          sudo installer -pkg /tmp/python.pkg -target /
          # Verify this Python runs as x86_64 under Rosetta
          arch -x86_64 $PYTHON_BIN -c "import platform; assert platform.machine() == 'x86_64', f'Expected x86_64, got {platform.machine()}'"
          echo "✓ Python running as x86_64 under Rosetta"

      - name: Create x86_64 virtual environment
        run: |
          arch -x86_64 $PYTHON_BIN -m venv venv-x86
          # Verify the venv Python is actually x86_64
          arch -x86_64 venv-x86/bin/python -c "import struct; assert struct.calcsize('P') * 8 == 64; import platform; print(f'venv arch: {platform.machine()}')"

      # The venv's bundled pip performs the hash-checked install; a
      # `pip install --upgrade pip` here would be the one unpinned fetch in
      # the job, and pip itself is in the lock anyway.
      - name: Install dependencies (x86_64, hash-pinned, no build isolation)
        run: |
          arch -x86_64 venv-x86/bin/python scripts/lock_subset.py setuptools > "$RUNNER_TEMP/build-requirements.txt"
          arch -x86_64 venv-x86/bin/python -m pip install --require-hashes -r "$RUNNER_TEMP/build-requirements.txt"
          arch -x86_64 venv-x86/bin/python -m pip install --no-build-isolation --require-hashes -r requirements-lock.txt
          arch -x86_64 venv-x86/bin/python -m pip install --no-deps --no-build-isolation .
        env:
          ARCHFLAGS: "-arch x86_64"
          _PYTHON_HOST_PLATFORM: "macosx-11.0-x86_64"

      # The Intel side of the lock fork (cryptography 48.0.1, the last
      # release with x86_64 wheels) carries three advisories that are
      # unreachable here — X.509 path building and PKCS#7 decryption, which
      # this code never calls — and pip-audit evaluates markers for the
      # environment it runs in, so CI's Ubuntu audit never sees them.
      # Audit that side too, ignoring exactly those three, so a NEW advisory
      # against 48.0.1 still fails the Intel build.
      - name: Audit the Intel side of the lock
        run: |
          arch -x86_64 venv-x86/bin/pip-audit -r requirements-lock.txt --strict --disable-pip \
            --ignore-vuln PYSEC-2026-3552 --ignore-vuln PYSEC-2026-3553 --ignore-vuln PYSEC-2026-3554

      - name: Verify C extensions are x86_64
        run: |
          # Confirm critical native extensions are the right architecture
          arch -x86_64 venv-x86/bin/python -c "
          import platform
          assert platform.machine() == 'x86_64', f'Wrong arch: {platform.machine()}'
          # Import all native C extensions to confirm they load under x86_64
          from cryptography.hazmat.bindings._rust import _openssl
          import argon2
          print('✓ All native extensions loaded as x86_64')
          "

      - name: Build .app and .dmg (x86_64)
        run: arch -x86_64 venv-x86/bin/python scripts/build.py --arch x86_64 --skip-tests
        env:
          ARCHFLAGS: "-arch x86_64"
          _PYTHON_HOST_PLATFORM: "macosx-11.0-x86_64"

      # Architecture *and* signature: an unsigned or half-signed .app opens
      # as "damaged and can't be opened" rather than showing the expected
      # unidentified-developer prompt, which is the exact failure the ad-hoc
      # signing exists to prevent.  build.py already fails on a signing
      # error; this is the independent check on the artefact we publish.
      - name: Verify the built app is x86_64 and signed
        run: |
          file dist/tk/quantacrypt.app/Contents/MacOS/quantacrypt
          file dist/tk/quantacrypt.app/Contents/MacOS/quantacrypt | grep -q "x86_64" || { echo "ERROR: binary is not x86_64!"; exit 1; }
          codesign --verify --deep --strict dist/tk/quantacrypt.app
          echo "✓ Binary verified as x86_64 and signed"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quantacrypt-x86_64
          path: dist/quantacrypt-x86_64.dmg
          if-no-files-found: error

  build-native:
    name: Build native app (arm64)
    needs: test
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/stamp_version.py "${GITHUB_REF#refs/tags/v}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (hash-pinned, no build isolation)
        run: |
          python scripts/lock_subset.py setuptools > "$RUNNER_TEMP/build-requirements.txt"
          pip install --require-hashes -r "$RUNNER_TEMP/build-requirements.txt"
          pip install --no-build-isolation --require-hashes -r requirements-lock.txt
          pip install --no-deps --no-build-isolation .

      # XcodeGen generates the .xcodeproj — every build phase the Release
      # xcodebuild executes — so it is pinned by release and SHA-256 like
      # the python.org installer, not resolved from homebrew-core.
      - name: Install XcodeGen (pinned, SHA-256 verified)
        run: bash scripts/install_xcodegen.sh

      # One command → one .app: helper bundle + icons + xcodegen + Release
      # xcodebuild + DMG (scripts/build.py --native).
      - name: Build QuantaCrypt.app and DMG
        run: python scripts/build.py --native --skip-tests --arch arm64

      # get-task-allow lets any same-user process take the app's task port
      # and read the memory holding passwords and shares; Xcode injects it
      # into every non-archive build unless told not to.  build.py passes
      # CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO and checks; this is the
      # independent check on the artefact we publish.
      - name: Verify the app is arm64, carries the helper, and is not debuggable
        run: |
          file dist/QuantaCrypt.app/Contents/MacOS/QuantaCrypt | grep -q arm64
          test -x dist/QuantaCrypt.app/Contents/Helpers/qc-core.app/Contents/MacOS/qc-core
          codesign --verify --deep --strict dist/QuantaCrypt.app
          if codesign -d --entitlements - dist/QuantaCrypt.app 2>&1 | grep -q get-task-allow; then
            echo "::error::QuantaCrypt.app carries com.apple.security.get-task-allow"
            exit 1
          fi

      - name: Upload native DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuantaCrypt-native-arm64
          path: dist/QuantaCrypt-native-arm64.dmg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-arm64, build-x86_64, build-native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # gh release create
      id-token: write        # Sigstore signing for the provenance attestation
      attestations: write    # store the attestation on the repository

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download all DMG artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # Collect by glob rather than by hand: the previous list named
      # artifacts/QuantaCrypt-arm64/QuantaCrypt-arm64.dmg, which was wrong
      # in both segments (the native job uploads QuantaCrypt-native-arm64),
      # so every tag failed here after a ~60-minute build and bump-version
      # never ran. Asserting the count keeps a silently-missing artifact
      # from publishing a partial release instead.
      - name: Collect the DMGs and write SHA256SUMS
        run: |
          mapfile -t DMGS < <(find artifacts -name '*.dmg' | sort)
          echo "Found ${#DMGS[@]} DMG(s):"
          printf '  %s\n' "${DMGS[@]}"
          if [ "${#DMGS[@]}" -ne 3 ]; then
            echo "::error::expected 3 DMGs (arm64, x86_64, native), got ${#DMGS[@]}"
            exit 1
          fi
          mkdir -p release
          for dmg in "${DMGS[@]}"; do cp "$dmg" release/; done
          # Basenames only, so `shasum -a 256 -c SHA256SUMS` works from the
          # folder a user downloaded the DMGs into.
          (cd release && sha256sum -- *.dmg | tee SHA256SUMS)

      # Signed statement, verifiable offline against Sigstore, that these
      # exact bytes came out of this workflow at this commit:
      #   gh attestation verify <file> --owner alexboccard
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.dmg
            release/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # A pre-release must not become `releases/latest`: the in-app
          # updater polls that, so a beta there is offered to every stable
          # user (review F-201).  gh marks one only when asked.
          # The verdict, not an exit status: a probe that cannot run must
          # not read as "stable release".
          verdict=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from stamp_version import is_prerelease; print("yes" if is_prerelease(sys.argv[1]) else "no")' "${TAG#v}")
          case "$verdict" in
            yes) pre=(--prerelease --latest=false) ;;
            no)  pre=() ;;
            *)   echo "::error::could not classify $TAG as a release or a pre-release (got '$verdict')"; exit 1 ;;
          esac
          gh release create "$TAG" release/*.dmg release/SHA256SUMS "${pre[@]}" \
            --title "QuantaCrypt $TAG" \
            --generate-notes \
            --notes "Verify a download with \`shasum -a 256 -c SHA256SUMS\` (macOS) or \`sha256sum -c SHA256SUMS\`, and its provenance with \`gh attestation verify <file> --owner alexboccard\`."

  bump-version:
    name: Commit released version back to repo
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # git push origin master

    steps:
      # persist-credentials: false — the steps below resolve packages and
      # build an sdist; none of that should run with a write token sitting
      # in .git/config.  The push authenticates explicitly.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: master
          persist-credentials: false
          fetch-depth: 0           # the ancestry check below needs history

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # A maintenance tag on an older commit (v1.3.1 while master is 1.4.0)
      # must not rewrite master's version files and lock to the older
      # version — and would have done so with [skip ci].
      - name: Refuse to stamp master from a tag on another history or an older version
        run: |
          set +e
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          rc=$?
          set -e
          case $rc in
            0) ;;
            1) echo "::notice::${GITHUB_REF#refs/tags/} is not on master; leaving master untouched"; exit 0 ;;
            *) echo "::error::git merge-base failed (exit $rc)"; exit "$rc" ;;
          esac
          # A tag on master's history but older than what master carries
          # (a hotfix tagged on an earlier commit) must not roll master back.
          python3 - "${GITHUB_REF#refs/tags/v}" <<'PY'
          import re, sys, tomllib
          # The same order as the updater's _version_key: a pre-release
          # ranks below its final, so a v1.5.0-beta tag pushed after 1.5.0
          # is on master leaves master alone.
          def key(v):
              m = re.match(r"(\d+(?:\.\d+)*)", v)
              if not m: return None
              rest = v[m.end():].strip().lstrip("-._").lower()
              rank = 0 if not rest or rest.startswith("+") else (1 if rest.startswith("post") else -1)
              return tuple(int(p) for p in m.group(1).split(".")) + (rank,)
          tag, cur = sys.argv[1], tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if key(tag) is None:
              print(f"::notice::{tag!r} is not a version; leaving master untouched"); sys.exit(0)
          if key(tag) < (key(cur) or (0, 0)):
              print(f"::notice::v{tag} is older than master's {cur}; leaving master untouched"); sys.exit(0)
          with open(__import__("os").environ["GITHUB_ENV"], "a") as f: f.write("on_master=1\n")
          PY

      # Same structural stamp as the build jobs, so master cannot end up
      # carrying a version the release never built.  It also reaches
      # macos/project.yml, which the sed here never touched — the native
      # app's CFBundleShortVersionString has been stamped in CI and then
      # left at the old value in the repo on every release so far.
      - name: Update version files
        if: env.on_master == '1'
        run: python3 scripts/stamp_version.py "${GITHUB_REF#refs/tags/v}"

      # uv.lock records the project's own version, so bumping pyproject.toml
      # without relocking left the lock one release behind, every release.
      # The lock is the "a release is what was reviewed" guarantee that CI
      # installs from with --require-hashes; uv comes from that same lock so
      # the resolver version is pinned too.
      - name: Regenerate the dependency lock
        if: env.on_master == '1'
        run: |
          python scripts/lock_subset.py setuptools > "$RUNNER_TEMP/build-requirements.txt"
          pip install --require-hashes -r "$RUNNER_TEMP/build-requirements.txt"
          pip install --no-build-isolation --require-hashes -r requirements-lock.txt
          uv lock
          uv export --frozen --no-emit-project --all-extras \
            --format requirements.txt -o requirements-lock.txt

      - name: Commit and push
        if: env.on_master == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/quantacrypt/__init__.py macos/project.yml \
                  uv.lock requirements-lock.txt
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "chore: bump version to $VER [skip ci]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
