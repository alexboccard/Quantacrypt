name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Release builds (release.yml) only run on v* tags — without this workflow,
# day-to-day pushes and Dependabot PRs land on master with zero automated
# testing and the 95% coverage gate is honor-system.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The GUI pass is serial by necessity (one process per file), so the job
    # is minutes rather than seconds; 30 left no headroom.
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      # libfuse2: fusepy imports only when a backend is loadable (it raises
      # OSError, not ImportError, without one), so the FUSE contract tests
      # would otherwise skip.
      # xvfb + tk: the GUI suite drives real Tk widgets. Without a display
      # every one of those tests skips, which is worse than useless — review
      # run 12 found ~116 of them silently skipping on every CI run, having
      # replaced source-text assertions that at least executed.
      - name: Install libfuse, Tk and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse2 xvfb python3-tk

      # Hash-pinned lock (uv.lock → requirements-lock.txt, all extras) so a
      # release is what was reviewed, not what PyPI serves that day.
      # The lock pins what is installed; pip's build isolation would still
      # fetch an unpinned setuptools to build fusepy's sdist and this
      # project.  Install the backend from the lock first, then build with
      # no isolation so nothing outside the lock ever runs.
      - name: Install dependencies (hash-pinned, no build isolation)
        run: |
          python scripts/lock_subset.py setuptools > "$RUNNER_TEMP/build-requirements.txt"
          pip install --require-hashes -r "$RUNNER_TEMP/build-requirements.txt"
          pip install --no-build-isolation --require-hashes -r requirements-lock.txt
          pip install --no-deps --no-build-isolation -e .

      # pip-audit itself comes from the hash-pinned lock (dev extra).
      - name: Audit dependencies for known advisories
        run: pip-audit -r requirements-lock.txt --strict --disable-pip

      # Nothing checked this before, and it had already drifted: the lock
      # recorded kyber-py>=0.8 / shamirs>=1.0 against a pyproject that says
      # >=1.0,<2 / >=4.0,<5, and pytest-xdist, pytest-timeout and
      # pytest-randomly were missing from it outright — so the hash-pinned
      # install CI calls its "a release is what was reviewed" guarantee was
      # neither. One matrix entry: the answer cannot vary by interpreter.
      - name: Check the lockfile matches pyproject.toml
        if: matrix.python-version == '3.13'
        run: |
          uv lock --check
          uv export --frozen --no-emit-project --all-extras \
            --format requirements.txt -o requirements-lock.txt
          git diff --exit-code -- requirements-lock.txt

      # scripts/run_tests.sh rather than a bare pytest: Tk is not xdist-safe
      # (29 GUI failures under -n auto, all passing serially) and Tk state
      # accumulates within an interpreter (14:24 for six GUI files in one
      # process against 6:05 across per-file processes), so the run is split
      # into a parallel non-GUI pass and a serial one-process-per-file GUI
      # pass. One xvfb-run wraps the script so every child pytest inherits
      # the same display.
      - name: Run tests
        run: PY="$(command -v python)" xvfb-run -a bash scripts/run_tests.sh --cov

      # Per file, not in aggregate: coverage.py's fail_under is one number
      # over the whole project, so a well-covered core/ hid
      # ui/volume_manager.py at 11% and __main__.py at 0%. Run explicitly
      # here as well as inside run_tests.sh — the gate must not hinge on a
      # flag someone drops from the script.
      - name: Coverage gate (95% per file)
        run: python scripts/check_coverage.py --min 95

      # Assert the FUSE-backed tests really ran: they skip on hosts without a
      # loadable libfuse (every macOS runner), and this is the one job that
      # installs one, so a silent skip here would be a regression nobody sees.
      - name: Assert the FUSE tests were not skipped
        shell: bash   # adds -o pipefail: a failure upstream of `tee` must fail the step
        run: |
          python -m pytest tests/test_core_edges.py tests/test_audit_2026_09.py -q -o addopts="" \
            --no-header -p no:cacheprovider -p no:randomly -rs \
            -k "TestMountVolume or test_available_when_fusepy_imports or TestMountPointMustBeEmpty" 2>&1 | tee /tmp/fuse.txt
          if grep -qi "fusepy/libfuse unavailable" /tmp/fuse.txt; then
            echo "::error::FUSE-backed tests skipped — libfuse2 is not loadable on this runner"
            exit 1
          fi

      # Assert the GUI suite really ran: a display that silently fails to
      # start would put us straight back to ~116 quiet skips.
      - name: Assert the GUI tests were not skipped
        shell: bash   # adds -o pipefail: a failure upstream of `tee` must fail the step
        run: |
          xvfb-run -a python -m pytest tests/test_gui_logic.py -q -o addopts="" \
            --no-header -p no:cacheprovider -p no:randomly -rs 2>&1 | tee /tmp/gui.txt
          if grep -qi "needs real tkinter\|no usable display" /tmp/gui.txt; then
            echo "::error::GUI tests skipped — the virtual display is not working"
            exit 1
          fi

  # The native shell: the qc-core helper (PyInstaller, no Tk) plus the
  # SwiftUI app generated from macos/project.yml.  Runs on every push so a
  # protocol change that breaks the Swift client is caught before a tag.
  macos-shell:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install dependencies (hash-pinned, no build isolation)
        run: |
          python scripts/lock_subset.py setuptools > "$RUNNER_TEMP/build-requirements.txt"
          pip install --require-hashes -r "$RUNNER_TEMP/build-requirements.txt"
          pip install --no-build-isolation --require-hashes -r requirements-lock.txt
          pip install --no-deps --no-build-isolation -e .

      - name: Build qc-core helper (smoke-tested by the build script)
        run: python scripts/build.py --helper --skip-tests

      # Pinned by release and SHA-256 (scripts/install_xcodegen.sh), not
      # resolved from homebrew-core on the day.
      - name: Install XcodeGen (pinned, SHA-256 verified)
        run: bash scripts/install_xcodegen.sh

      # project.yml lists the .icns files as resources and they are gitignored
      # build artifacts, so a clean checkout must render them or xcodebuild
      # fails at CpResource. xcodegen's `optional: true` only silences the
      # generation-time check, not the build.
      - name: Render app icons
        run: python scripts/build.py --icons --skip-tests

      - name: Generate Xcode project
        run: cd macos && xcodegen generate

      - name: Build and test the app
        run: |
          cd macos
          xcodebuild -project QuantaCrypt.xcodeproj -scheme QuantaCrypt \
            -configuration Debug -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project QuantaCrypt.xcodeproj -scheme QuantaCrypt \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO test
